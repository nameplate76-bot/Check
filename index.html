<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계정 보안 확인</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f7fb;
    color: #202124;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(92vw, 460px);
    background: white;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    text-align: center;
  }
  .icon {
    width: 62px; height: 62px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    background: #fff3cd;
    font-size: 30px;
  }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.55; margin: 8px 0; }
  .muted { color: #6b7280; }
  .btn {
    margin-top: 18px;
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 700;
    background: #1a73e8;
    color: white;
  }
  .hidden { display: none; }
  .spinner {
    width: 46px; height: 46px;
    border: 5px solid #e5e7eb;
    border-top-color: #1a73e8;
    border-radius: 50%;
    margin: 20px auto;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .photo {
    width: 100%;
    border-radius: 14px;
    margin-top: 14px;
    display: block;
  }
  .reveal h2 {
    font-size: 25px;
    margin: 14px 0 8px;
  }
  .joke {
    font-size: 18px;
    font-weight: 700;
  }
</style>
</head>

    <div class="icon">⚠️</div>
    <h1>계정 보안 확인</h1>
    <p>평소와 다른 접근이 감지되었습니다.</p>
    <p class="muted">최근 접속 정보를 확인합니다.</p>
    <button class="btn" id="checkBtn" type="button">보안 확인</button>
  </section>
